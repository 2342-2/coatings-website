# Render Blueprint — deploys both services in one go.
# On Render: New + → Blueprint → connect this repo → Apply.
# Service URLs below follow Render's predictable pattern
# (https://<name>.onrender.com), so they're pre-wired to find each other.

services:
  # ---- API (Node + SQLite, zero npm dependencies) ----
  - type: web
    name: maridadi-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: CLIENT_ORIGIN
        value: https://maridadi-client.onrender.com

  # ---- Website (React + Tailwind, static build) ----
  - type: web
    name: maridadi-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://maridadi-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
